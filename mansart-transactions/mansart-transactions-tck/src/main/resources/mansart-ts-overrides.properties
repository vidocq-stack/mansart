#
# Override file for ts.jte — appended to .tck-cache/transactions-tck/bin/ts.jte at build time
# by the maven-antrun-plugin (profile `full-tck`).
#
# Pure JTA standalone — no Glassfish, no EJB container. Uses the official "no container"
# deployment handler shipped with the TCK (xml/impl/none/deploy.xml).
#
# Variables resolved by ant at build time :
#   ${user.home}                — JVM property
#   @jakarta.transaction.api@  — set explicitly in pom.xml -> antrun
#   @mansart.tx.core.jar@      — set explicitly in pom.xml -> antrun
#   @mansart.tx.api.jar@       — set explicitly in pom.xml -> antrun
#

# Container-less : no web server to talk to.
webServerHost=localhost
webServerPort=8080
webServerHome=

# Vendor implementation : "none" → tsharness skips deploy/undeploy.
impl.vi=none
web.deployment.handler=xml/impl/none/deploy.xml

# Classpath of the JTA implementation under test (Mansart) + the spec API.
# Must be set to the absolute paths in the user's local ~/.m2 (resolved by the antrun task).
jtaJarClasspath=@jakarta.transaction.api@

jta.classes=${jtaJarClasspath}${pathsep}\
            @mansart.tx.api.jar@${pathsep}\
            @mansart.tx.core.jar@${pathsep}\
            @jakarta.cdi.api@${pathsep}\
            @jakarta.interceptor.api@${pathsep}\
            @jakarta.annotation.api@

# Signature test classpath = JTA classpath (no extra container artefacts to scan).
sigTestClasspath=${jta.classes}
