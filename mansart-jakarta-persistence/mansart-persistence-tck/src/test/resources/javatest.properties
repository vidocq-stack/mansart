# Jakarta Persistence 3.2 TCK Configuration for Mansart
# JavaTest Harness Properties

# Test Technology Type
test.find.classes=ee.jakarta.tck.persistence
test.find.exclude=ee.jakarta.tck.persistence.common.signaturetest

# Test Suite Configuration
ts.home=.
platform.mode=standalone

# Provider Configuration
provider.classname=io.vidocq.mansart.persistence.core.MansartPersistenceProvider

# Database Configuration (H2 for tck-run profile)
db.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
db.driver=org.h2.Driver

# Output Configuration
log.dir=target/tck-logs
report.dir=target/tck-reports

# Classpath Configuration
javatest.classpath=${surefire.test.class.path}

# Test Execution
concurrency=1
