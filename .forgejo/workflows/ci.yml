name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      # Pool d'abord — mansart-jakarta-data et mansart-transactions le consomment en
      # <scope>test</scope> via mansart-pool-core.
      - name: Build & test — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp verify

      - name: Install — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp install -DskipTests

      # mansart-jakarta-data : reactor principal. Le module mansart-data-tck
      # est volontairement HORS reactor (model 4.0.0) — il ne tourne pas ici,
      # son lancement passe par run-official-tck-data-1.0.sh.
      - name: Build & test — mansart-jakarta-data
        working-directory: mansart-jakarta-data
        run: mvn -B -ntp verify

      - name: Install — mansart-jakarta-data
        working-directory: mansart-jakarta-data
        run: mvn -B -ntp install -DskipTests

      # mansart-transactions : Jakarta Transactions 2.0 (1PC d'abord). mansart-transactions-tck
      # est HORS reactor (model 4.0.0), lancé via run-official-tck-transactions-2.0.sh.
      - name: Build & test — mansart-transactions
        working-directory: mansart-transactions
        run: mvn -B -ntp verify

      # mansart-persistence : encore en spec uniquement (PLAN.md), pas de pom.

      - name: Deploy — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp deploy -DskipTests

      - name: Deploy — mansart-jakarta-data
        working-directory: mansart-jakarta-data
        run: mvn -B -ntp deploy -DskipTests

      - name: Deploy — mansart-transactions
        working-directory: mansart-transactions
        run: mvn -B -ntp deploy -DskipTests
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "❌ Secret Forgejo manquant : SLACK_WEBHOOK_URL" >&2
            exit 1
          fi
          payload=$(node <<'JS'
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ❌ *Build CI échoué* — \`${process.env.REPO}\`@${process.env.REF}\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"


      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail
          # Silencieux si secret absent — un build success ne doit pas fail à cause du notify.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "ℹ️ Secret SLACK_WEBHOOK_URL absent — notif success skipped"
            exit 0
          fi
          VERSION=$(mvn -q -DforceStdout -N -Dexpression=project.version help:evaluate 2>/dev/null || echo "?")
          export VERSION
          export SHORT_SHA="${SHA:0:7}"
          payload=$(node <<'JS'
          const msg = process.env.COMMIT_MSG || '';
          const subject = msg.split('\n')[0];
          const author = process.env.COMMIT_AUTHOR ? ` par *${process.env.COMMIT_AUTHOR}*` : '';
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ✅ *Build CI réussi* — \`${process.env.REPO}\`@${process.env.REF} (v${process.env.VERSION})\n> \`${process.env.SHORT_SHA}\`${author} — _${subject}_\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
