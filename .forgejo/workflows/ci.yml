name: CI

on:
  push:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      # Pool d'abord — mansart-jakarta-data le consomme en <scope>test</scope>
      # via mansart-pool-core (test d'interop M9).
      - name: Build & test — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp verify

      - name: Install — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp install -DskipTests

      # mansart-jakarta-data : reactor principal. Le module mansart-data-tck
      # est volontairement HORS reactor (model 4.0.0) — il ne tourne pas ici,
      # son lancement passe par run-official-tck-data-1.0.sh.
      - name: Build & test — mansart-jakarta-data
        working-directory: mansart-jakarta-data
        run: mvn -B -ntp verify

      # mansart-persistence : encore en spec uniquement (PLAN.md), pas de pom.

      - name: Deploy — mansart-pool
        working-directory: mansart-pool
        run: mvn -B -ntp deploy -DskipTests

      - name: Deploy — mansart-jakarta-data
        working-directory: mansart-jakarta-data
        run: mvn -B -ntp deploy -DskipTests
