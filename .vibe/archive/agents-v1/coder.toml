# Code-writing subagent — portable, not specific to any spec or sub-module.
# `dev` delegates well-specified implementation tasks here (one behaviour,
# a stated failing test, at most 4 files — see the project's own
# architecture skill) via the `task` tool. Depth-limited to 1 by Vibe
# itself: `coder` cannot further delegate.
#
# MODEL CHOICE (see the `model-discipline` skill for the full evidence):
# Mistral Small 4 — GA 2026-03-16, Apache 2.0, absorbed the old Devstral
# agentic-coding line. Devstral itself is retired from La Plateforme
# (confirmed, every SKU past its retirement date on docs.mistral.ai's
# deprecated-models table) — Small 4 is Mistral's own current
# recommendation for exactly this role ("Fast, cost-effective general
# use", Vibe CLI's own model table) at $0.15/$0.6 per M tokens, 7x
# cheaper than GLM 5.2 on output (12x cheaper than Medium 3.5). Free
# local alternative below if cost still matters more than staying
# cloud-hosted.

display_name = "Coder"
description = "Implements a well-specified change: writes/edits the code, does not decide scope or architecture. Full-auto: writes, edits, and bash all auto-approve, except the shared destructive-ops denylist."
safety = "destructive"
agent_type = "subagent"

active_model = "mistral-small-4"
# active_model = "devstral-local"   # free, local via oMLX — needs the server up
# active_model = "glm-5-2"   # fallback if Small 4 underperforms on a card

[tools.write_file]
permission = "always"

[tools.edit]
permission = "always"

[tools.bash]
permission = "always"
denylist = [
    "git reset",
    "git clean",
    "git restore",
    "git checkout --",
    "git checkout HEAD",
    "git push",
    "rm -rf",
    "docker rm",
    "docker volume rm",
]
