default_agent = "dev"
applied_migrations = [
    "bash_read_only_defaults_v1",
]
active_model = ""

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
api_style = "openai"
backend = "mistral"

[[providers]]
name = "omlx"
api_base = "http://127.0.0.1:8000/v1"
api_key_env_var = "OMLX_API_KEY"
api_style = "openai"
backend = "generic"

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
thinking = "max"
supports_images = true
input_price = 1.5
output_price = 7.5
cached_input_price = 0.15
auto_compact_threshold = 150000

[[models]]
name = "mistral-small-latest"
provider = "mistral"
alias = "mistral-small-4"
temperature = 0.2
thinking = "off"
supports_images = true
input_price = 0.15
output_price = 0.6
cached_input_price = 0.015
auto_compact_threshold = 150000

[[models]]
name = "Devstral-Small-2-24B-Instruct-2512-8bit"
provider = "omlx"
alias = "devstral-local"
temperature = 0.15
thinking = "off"
input_price = 0.0
output_price = 0.0
auto_compact_threshold = 150000
active_model = "mistral-medium-3.5"

[compaction_model]
name = "mistral-small-latest"
provider = "mistral"
alias = "compactor"
temperature = 0.2
thinking = "off"

# Project-level fallback — only reached by agents without their own
# [tools.bash] override, i.e. Vibe's built-ins (`explore`, `lean`), since
# `dev` and every custom subagent now set their own always+denylist block.
# Full-auto (2026-09-04, "tous les agents en auto"): same shared denylist
# as every agent profile, no allowlist ceiling.
[tools.bash]
permission = "always"
denylist = [
    "git reset",
    "git clean",
    "git restore",
    "git checkout --",
    "git checkout HEAD",
    "git push",
    "rm -rf",
    "docker rm",
    "docker volume rm",
]

# NOTE: `allowlist` used to be listed here as a domain restriction, but
# Vibe's WebFetchConfig (vibe/core/tools/builtins/web_fetch.py) has no such
# field — Pydantic's extra="allow" silently kept it as inert data, never
# read by resolve_permission(), which only checks `permission` and asks
# per-domain otherwise. It never restricted anything. Set to "always" for
# full-auto (2026-09-04): every agent can fetch any URL with no prompt —
# there is no config-level way to keep a domain allowlist in this Vibe
# version, only per-domain runtime grants (ask -> Always allow) or a flat
# permission.
[tools.web_fetch]
permission = "always"

[tools.web_search]
permission = "always"
