applied_migrations = [
    "bash_read_only_defaults_v1",
]
active_model = "qwen-next-omlx"

[[mcp_servers]]
name = "java-lsp"
transport = "stdio"
command = "/Users/yblazart/go/bin/mcp-language-server"
args = [
    "--workspace",
    "/Users/yblazart/projects/perso/vidocq/mansart",
    "--lsp",
    "/opt/homebrew/bin/jdtls",
    "--",
    "-data",
    "/Users/yblazart/.cache/jdtls/mansart-workspace",
]
startup_timeout_sec = 120
tool_timeout_sec = 60

[mcp_servers.env]
JAVA_HOME = "/Users/yblazart/.sdkman/candidates/java/25-tem"

[[mcp_servers]]
name = "ctx"
transport = "stdio"
command = "/opt/homebrew/bin/node"
args = [
    "/Users/yblazart/.claude/plugins/cache/context-mode/context-mode/1.0.65/start.mjs",
]
startup_timeout_sec = 60
