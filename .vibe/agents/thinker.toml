# One hard decision, in a fresh, isolated context, after two failed
# attempts at the same problem. Direct port of OpenCode's `thinker`. Medium
# 3.5 at max thinking — the point isn't a smarter model than `dev` (it's
# the same model), it's an uncluttered context: fresh eyes, no accumulated
# confusion from the failed attempts. Returns a decision, not an essay.

display_name = "Thinker"
description = "One hard decision in an isolated context, after two failed attempts (Medium 3.5, max thinking). Returns a decision, not an essay."
safety = "safe"
agent_type = "subagent"

active_model = "mistral-medium-3.5"
enabled_tools = ["grep", "read_file", "skill"]

[tools.write_file]
permission = "never"

[tools.edit]
permission = "never"
